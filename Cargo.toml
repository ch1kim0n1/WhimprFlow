# WhimprFlow  -  Cargo workspace root.
# Members are added as each crate is scaffolded (a workspace may only list dirs that exist).
[workspace]
resolver = "2"
members = [
    "crates/whimpr-ipc",
    "crates/whimpr-core",
    "crates/whimpr-audio",
    "crates/whimpr-asr",
    "crates/whimpr-cleanup",
    "crates/whimpr-llm-worker",
    "crates/whimpr-sidecar",
    "src-tauri",
    "tools/whimpr-license",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "LicenseRef-WhimprFlow-EULA"
authors = ["WhimprFlow"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.95"
thiserror = "1"
tracing = "0.1"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Local patch: zmij's build.rs is blocked by Windows Device Guard. Since rustc
# 1.96 doesn't need any cfg flags from it (only check-cfg directives), we patch
# it with a no-build-script copy. Remove this patch on machines without Device Guard.
[patch.crates-io]
zmij = { path = ".patches/zmij" }
num-traits = { path = ".patches/num-traits" }
